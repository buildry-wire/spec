name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vectors are self-consistent
        run: python tools/test_vectors.py
      - name: Vectors are reproducible (no drift)
        run: |
          python tools/gen_vectors.py
          git diff --exit-code test-vectors/
